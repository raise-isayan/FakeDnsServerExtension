plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

application {
    // Define the main class for the application.
    mainClass = 'fakedns.server.SimpleDnsServer'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

shadowJar {
//   exclude 'META-INF/*.SF'
//   exclude 'META-INF/*.DSA'
//   exclude 'META-INF/*.RSA'
//   exclude 'junit/**'
//   mergeServiceFiles()
   exclude 'META-INF/services/java.net.spi.InetAddressResolverProvider'
   archiveClassifier.set('')
   destinationDirectory = file('release')
   archiveVersion.set("v${release_version_major}")
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching ('**/*.properties') {
       expand(project.properties)
       // naitive2ascii
       filter(org.apache.tools.ant.filters.EscapeUnicode)
    }
}

clean.doFirst {
    delete fileTree('release') {
      include '*.jar'
    }
}

task release(type: Zip, dependsOn: ['build']) {
    archiveBaseName ="${rootProject.name}_v${release_version_major}.${release_version_minor}"
    destinationDirectory = file("${projectDir}")
    from rootProject.rootDir
    include '*'
    include 'gradle/**'
    include 'image/**'
    include 'libs/**'
    include 'src/**'
    include 'release/**'
    exclude 'build'
    exclude '.git'
    exclude '.gradle'
    exclude '*.zip'
}

dependencies {
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-nop/1.7.36
    implementation 'org.slf4j:slf4j-nop:2.0.17'

    // https://mvnrepository.com/artifact/org.bouncycastle/bcprov-jdk18on
//    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'
    // https://mvnrepository.com/artifact/org.bouncycastle/bcprov-jdk18on
//    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'

    // https://github.com/raise-isayan/BurpExtensionCommons
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // standalone 利用のため
    // https://mvnrepository.com/artifact/net.portswigger.burp.extensions/montoya-api
    implementation 'net.portswigger.burp.extensions:montoya-api:2026.2'

    // Source: https://mvnrepository.com/artifact/dnsjava/dnsjava
    implementation 'dnsjava:dnsjava:3.6.4'

    // Use JUnit Jupiter for testing.
    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'

}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
